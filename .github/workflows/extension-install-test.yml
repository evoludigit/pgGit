name: Extension Install Test

on:
  push:
    branches: [main, develop]
    paths:
      - 'sql/**'
      - '*.sql'
      - 'Makefile'
      - 'pggit.control'
      - 'scripts/create_extension_sql.sh'
      - '.github/workflows/extension-install-test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'sql/**'
      - '*.sql'
      - 'Makefile'
      - 'pggit.control'
      - 'scripts/create_extension_sql.sh'
      - '.github/workflows/extension-install-test.yml'
  workflow_dispatch:

jobs:
  extension-install:
    name: Extension Install (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        postgres: ['15', '16', '17']

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install PostgreSQL ${{ matrix.postgres }}
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
          sudo apt-get update
          sudo apt-get install -y \
            postgresql-${{ matrix.postgres }} \
            postgresql-server-dev-${{ matrix.postgres }} \
            build-essential \
            make

      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"

      - name: Regenerate consolidated SQL
        run: |
          chmod +x scripts/create_extension_sql.sh
          ./scripts/create_extension_sql.sh

      - name: Build and install extension
        env:
          PG_CONFIG: /usr/lib/postgresql/${{ matrix.postgres }}/bin/pg_config
        run: |
          make PG_CONFIG=$PG_CONFIG
          sudo make PG_CONFIG=$PG_CONFIG install

      - name: Create test database
        run: |
          sudo -u postgres createdb pggit_extension_test

      - name: 'Test 1: Clean install with CREATE EXTENSION CASCADE'
        run: |
          echo "=== Testing CREATE EXTENSION pggit CASCADE ==="
          sudo -u postgres psql -d pggit_extension_test -v ON_ERROR_STOP=1 <<'EOF'
          CREATE EXTENSION pggit CASCADE;
          SELECT 'CREATE EXTENSION pggit CASCADE succeeded' AS result;
          EOF

      - name: 'Test 2: Schema validation'
        run: |
          echo "=== Validating schema objects ==="
          sudo -u postgres psql -d pggit_extension_test -v ON_ERROR_STOP=1 <<'EOF'
          -- Verify key tables exist
          DO $$
          DECLARE
            missing text[];
            tbl text;
          BEGIN
            FOR tbl IN SELECT unnest(ARRAY['commits', 'branches', 'merge_conflicts', 'merge_history'])
            LOOP
              IF NOT EXISTS (
                SELECT 1 FROM information_schema.tables
                WHERE table_schema = 'pggit' AND table_name = tbl
              ) THEN
                missing := array_append(missing, tbl);
              END IF;
            END LOOP;

            IF array_length(missing, 1) > 0 THEN
              RAISE EXCEPTION 'Missing tables: %', array_to_string(missing, ', ');
            END IF;

            RAISE NOTICE 'All expected tables exist';
          END $$;

          -- Verify pggit.version() is callable
          SELECT pggit.version() AS pggit_version;
          EOF

      - name: 'Test 3: Drop and recreate (lifecycle)'
        run: |
          echo "=== Testing DROP + CREATE lifecycle ==="
          sudo -u postgres psql -d pggit_extension_test -v ON_ERROR_STOP=1 <<'EOF'
          DROP EXTENSION pggit CASCADE;
          SELECT 'DROP EXTENSION succeeded' AS result;

          CREATE EXTENSION pggit CASCADE;
          SELECT 'Re-CREATE EXTENSION succeeded' AS result;

          -- Verify still functional after recreate
          SELECT pggit.version() AS pggit_version;
          EOF
