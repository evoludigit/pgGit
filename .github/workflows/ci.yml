name: ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo xtask ci

  extension:
    name: "extension (PostgreSQL ${{ matrix.pg }})"
    runs-on: ubuntu-latest

    strategy:
      matrix:
        pg: ["16"]

    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pggit_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGTAP_VERSION: v1.3.3

    steps:
      - uses: actions/checkout@v7

      - name: Build pgTAP from source
        run: |
          git clone -q --depth 1 --branch "$PGTAP_VERSION" https://github.com/theory/pgtap.git /tmp/pgtap
          make -C /tmp/pgtap sql/pgtap.sql || make -C /tmp/pgtap
          test -s /tmp/pgtap/sql/pgtap.sql

      - name: Load pgcrypto and pgTAP into the test database
        run: |
          psql -d pggit_test -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"
          psql -d pggit_test -v ON_ERROR_STOP=1 -q -f /tmp/pgtap/sql/pgtap.sql
          psql -d pggit_test -tA -c "SELECT pgtap_version();"

      - name: Install extension
        run: make -C extension install PGDATABASE=pggit_test

      - name: Unit tests
        run: make -C extension unit TEST_DB=pggit_test

      - name: Integration tests
        run: make -C extension integration TEST_DB=pggit_test

      - name: Lint
        run: make -C extension lint

      - name: Uninstall and reinstall
        run: |
          make -C extension uninstall PGDATABASE=pggit_test
          make -C extension install PGDATABASE=pggit_test

      - name: README quickstart check
        run: tools/quickstart-check.sh pggit_quickstart
