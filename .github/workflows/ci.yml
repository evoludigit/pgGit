name: ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: "extension (PostgreSQL ${{ matrix.pg }})"
    runs-on: ubuntu-latest

    strategy:
      matrix:
        pg: ["16"]

    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pggit_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Install pgTAP
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-${{ matrix.pg }}-pgtap

      - name: Enable pgcrypto and pgTAP
        run: |
          psql -h localhost -U postgres -d pggit_test \
            -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;" \
            -c "CREATE EXTENSION IF NOT EXISTS pgtap;"
        env:
          PGPASSWORD: postgres

      - name: Install pggit core
        run: |
          make -C extension install \
            PSQL="psql -h localhost -U postgres" \
            PGDATABASE=pggit_test
        env:
          PGPASSWORD: postgres

      - name: Run unit tests
        run: |
          make -C extension unit \
            PSQL="psql -h localhost -U postgres" \
            TEST_DB=pggit_test
        env:
          PGPASSWORD: postgres

      - name: Run integration tests
        run: |
          make -C extension integration \
            PSQL="psql -h localhost -U postgres" \
            TEST_DB=pggit_test
        env:
          PGPASSWORD: postgres

      - name: Run lint
        run: make -C extension lint

      - name: Test uninstall/reinstall idempotency
        run: |
          make -C extension uninstall \
            PSQL="psql -h localhost -U postgres" \
            PGDATABASE=pggit_test
          make -C extension install \
            PSQL="psql -h localhost -U postgres" \
            PGDATABASE=pggit_test
        env:
          PGPASSWORD: postgres

      - name: Run README quickstart check
        run: tools/quickstart-check.sh pggit_quickstart
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
